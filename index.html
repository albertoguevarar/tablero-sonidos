<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tablero de Sonidos</title>
<style>
  :root{
    --bg: #14120f;
    --panel: #1d1a15;
    --slot-empty: #23201a;
    --slot-border: #3a352b;
    --accent: #e8a33d;
    --accent-dim: #7a5a25;
    --text: #f2ece0;
    --text-dim: #a89e8c;
    --danger: #c2503f;
    --ok: #6fae6a;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 10px 16px;
    border-bottom: 1px solid var(--slot-border);
  }
  .topbar h1{
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .syncdot{
    width:7px; height:7px; border-radius:50%;
    background: var(--text-dim);
  }
  .syncdot.ok{ background: var(--ok); }
  .syncdot.err{ background: var(--danger); }
  .topbar .actions{ display:flex; gap:8px; }
  .iconbtn{
    background: var(--panel);
    border: 1px solid var(--slot-border);
    color: var(--text);
    width:36px; height:36px;
    border-radius: 10px;
    font-size: 18px;
    display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:active{ background: var(--slot-border); }

  #grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 12px;
    padding-bottom: calc(6px + env(safe-area-inset-bottom));
    max-width: 620px;
    margin: 0 auto;
    perspective: 800px;
  }
  .pad{
    aspect-ratio: 1 / 1;
    max-height: 200px;
    position: relative;
  }
  .padInner{
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.1, 0.2, 1);
  }
  .pad.flipped .padInner{ transform: rotateY(180deg); }
  .pad:active .padInner{ transform: scale(0.95); }
  .pad.flipped:active .padInner{ transform: rotateY(180deg) scale(0.95); }
  .padFace{
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: var(--radius);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 8px;
    font-weight: 600;
    font-size: clamp(13px, 3.4vw, 17px);
    line-height: 1.25;
    word-break: break-word;
  }
  .padFront{
    background: var(--slot-empty);
    border: 1.5px dashed var(--slot-border);
    color: var(--text-dim);
  }
  .pad.status-ok .padFront{
    background: linear-gradient(180deg, #2a3d1e, #1e2a15);
    border: 1.5px solid var(--ok);
    color: var(--text);
  }
  .pad.status-error .padFront{
    background: linear-gradient(180deg, #3d2e14, #2a2010);
    border: 1.5px solid var(--accent);
    color: var(--text);
  }
  .pad.status-checking .padFront{
    background: linear-gradient(180deg, #2a2114, #201a10);
    border: 1.5px solid var(--slot-border);
    color: var(--text-dim);
  }
  .pad.flipped .padFront{ pointer-events: none; }
  .padBack{
    background: linear-gradient(180deg, var(--danger), #3a1712);
    border: 1.5px solid var(--danger);
    color: #fff;
    transform: rotateY(180deg);
  }
  .pad:not(.flipped) .padBack{ pointer-events: none; }
  .backLabel{
    font-size: clamp(11px, 3vw, 14px);
    font-weight: 700;
    opacity: 0.9;
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .backStop{
    width: clamp(34px, 9vw, 46px); height: clamp(34px, 9vw, 46px);
    border-radius: 50%;
    background: rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(14px, 4vw, 18px);
  }
  .padFace .editIcon{
    position:absolute; bottom:6px; right:6px;
    width: clamp(24px, 6.5vw, 32px); height: clamp(24px, 6.5vw, 32px);
    border-radius:8px;
    background: rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(12px, 3vw, 16px);
  }
  .padFace .editIcon:active{ background: rgba(0,0,0,0.65); }
  .padFace .plus{
    font-size: 26px;
    font-weight: 300;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .padFace .uploading{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(0,0,0,0.55);
    border-radius: var(--radius);
    font-size:12px;
    color: var(--text);
  }

  .overlay{
    position:fixed; inset:0;
    background: rgba(0,0,0,0.6);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index: 50;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background: var(--panel);
    width:100%;
    max-width: 480px;
    margin: 0 auto;
    border-radius: 20px 20px 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom)) 18px;
    border-top: 1px solid var(--slot-border);
    border-left: 1px solid var(--slot-border);
    border-right: 1px solid var(--slot-border);
  }
  .sheet h2{ margin: 0 0 14px 0; font-size: 17px; }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block; font-size: 12px; color: var(--text-dim);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .field input[type="text"]{
    width:100%; background: var(--slot-empty); border: 1px solid var(--slot-border);
    color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 16px;
  }
  .rowbtns{ display:flex; gap:8px; margin-bottom: 10px; }
  .bigbtn{
    flex:1; padding: 14px 6px; border-radius: 12px; border: 1px solid var(--slot-border);
    background: var(--slot-empty); color: var(--text); font-size: 12.5px; font-weight: 600;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .bigbtn.record{ border-color: var(--danger); }
  .bigbtn.record.recording{ background: var(--danger); color:#fff; }
  .bigbtn span.ic{ font-size: 20px; }
  .status{ font-size: 13px; color: var(--text-dim); text-align:center; min-height: 18px; margin: 4px 0 12px 0; }
  .sheet .footerrow{ display:flex; gap:10px; }
  .footerrow button{ flex:1; padding: 13px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; }
  .save{ background: var(--accent); color:#1a1408; }
  .save:disabled{ opacity:0.5; }
  .close{ background: var(--slot-empty); color: var(--text); border:1px solid var(--slot-border) !important; }
  .delete{ background: transparent; color: var(--danger); border: 1px solid var(--danger) !important; }

  .reuseList{ max-height: 45vh; overflow-y: auto; margin-bottom: 14px; }
  .reuseItem{
    display:flex; align-items:center; gap:10px;
    padding: 12px; border-radius: 10px; background: var(--slot-empty);
    border: 1px solid var(--slot-border); margin-bottom: 8px;
  }
  .reuseItem .rname{ flex:1; font-size:14px; font-weight:600; }
  .reuseItem button{
    border:none; border-radius:8px; padding:8px 12px; font-size:13px; font-weight:700;
  }
  .reuseItem .rplay{ background: var(--slot-border); color: var(--text); }
  .reuseItem .rpick{ background: var(--accent); color:#1a1408; }
  .reuseEmpty{ text-align:center; color: var(--text-dim); font-size: 13px; padding: 20px; }

  .conflictText{ font-size: 14px; color: var(--text-dim); line-height:1.5; margin-bottom: 18px; }
  .conflictText b{ color: var(--text); }
  .conflictBtns{ display:flex; flex-direction:column; gap:10px; }
  .conflictBtns button{
    padding: 14px; border-radius: 12px; border: 1px solid var(--slot-border);
    font-size: 14px; font-weight: 700; text-align:left;
  }
  .conflictBtns .replaceBtn{ background: var(--accent); color:#1a1408; border:none; }
  .conflictBtns .newBtn{ background: var(--slot-empty); color: var(--text); }
  .conflictBtns .cancelBtn2{ background: transparent; color: var(--text-dim); text-align:center; }

  .swapLinkRow{ text-align:center; margin: -2px 0 14px 0; }
  .swapLink{
    background:none; border:none; color: var(--accent); font-size:13px;
    font-weight:600; text-decoration: underline;
  }

  .pinInput{
    width:100%; background: var(--slot-empty); border: 1px solid var(--slot-border);
    color: var(--text); padding: 16px 12px; border-radius: 10px; font-size: 24px;
    text-align:center; letter-spacing: 10px; margin-bottom: 10px;
  }
  .pinError{ font-size:13px; color: var(--danger); text-align:center; min-height:16px; margin-bottom:10px; }

  #fileInput{ display:none; }

  .hint{ font-size: 12px; color: var(--text-dim); text-align:center; padding: 10px 20px 4px 20px; }

  #startOverlay{
    position:fixed; inset:0; background: var(--bg); z-index: 100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 24px;
  }
  #startBtn{
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-dim));
    border: none; color: #1a1408; font-size: 15px; font-weight: 800; letter-spacing: 0.02em;
    box-shadow: 0 0 0 6px rgba(232,163,61,0.12);
    transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }
  #startBtn:active{ transform: scale(0.96); }
  #startBtn:disabled{
    background: var(--slot-empty);
    color: var(--text-dim);
    box-shadow: none;
  }
  #startBtn.success{
    background: radial-gradient(circle at 35% 30%, #8fd489, var(--ok));
    box-shadow: 0 0 0 6px rgba(111,174,106,0.25);
    color: #0d2210;
    transform: scale(1.06);
  }
  #startOverlay.hidden{ display:none; }
  #startError{ margin-top: 18px; font-size: 13px; color: var(--danger); max-width: 280px; min-height: 16px; }

  /* Cuando el teléfono está acostado (horizontal), usamos más columnas
     para que quepan más botones por fila y no haya que hacer tanto scroll */
  @media (orientation: landscape) and (max-height: 500px){
    #grid{
      grid-template-columns: repeat(5, 1fr);
      max-width: 900px;
    }
    .pad{ max-height: 130px; }
  }
</style>
</head>
<body>

<div id="startOverlay">
  <button id="startBtn" disabled>Cargando…</button>
  <div id="startError"></div>
</div>

<div class="topbar">
  <h1><span class="syncdot" id="syncDot"></span>Tablero de Sonidos</h1>
  <div class="actions">
    <button class="iconbtn" id="globalStopBtn" title="Detener sonido" style="display:none; background: var(--danger); border-color: var(--danger);">■</button>
    <button class="iconbtn" id="addPadBtn" title="Agregar botón">＋</button>
  </div>
</div>

<div id="grid"></div>
<div style="text-align:center; color:var(--text-dim); font-size:11px; padding-top:6px;">v13</div>
<div class="hint" id="hint">Toca un botón vacío para asignarle un sonido. Mantén presionado un botón lleno para editarlo.</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">Nuevo botón</h2>
    <div class="field">
      <label>Texto del botón</label>
      <input type="text" id="labelInput" placeholder="Ej. Aplausos, Entrada, Efecto 1" maxlength="24">
    </div>
    <div class="field">
      <label>Sonido</label>
      <div class="rowbtns">
        <button class="bigbtn record" id="recordBtn"><span class="ic">●</span>Grabar</button>
        <button class="bigbtn" id="uploadBtn"><span class="ic">⬆</span>Subir</button>
        <button class="bigbtn" id="reuseBtn"><span class="ic">🎵</span>Biblioteca</button>
      </div>
      <div class="status" id="status">Sin sonido asignado</div>
    </div>
    <div class="footerrow" style="margin-bottom:10px;">
      <button class="bigbtn" id="previewBtn" style="flex:none; width:100%;">▶ Escuchar</button>
    </div>
    <div class="swapLinkRow" id="swapLinkRow" style="display:none;">
      <button class="swapLink" id="swapLinkBtn" type="button">🔀 Intercambiar posición con otro botón</button>
    </div>
    <div class="footerrow">
      <button class="close" id="cancelBtn">Cancelar</button>
      <button class="delete" id="deleteBtn" style="display:none;">Eliminar</button>
      <button class="save" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<div class="overlay" id="swapOverlay">
  <div class="sheet">
    <h2>Cambiar posición</h2>
    <div class="rowbtns" style="margin-bottom:14px;">
      <button class="bigbtn" id="moveStartBtn"><span class="ic">⬆</span>Mover al inicio</button>
      <button class="bigbtn" id="moveEndBtn"><span class="ic">⬇</span>Mover al final</button>
    </div>
    <div class="field"><label>O intercambiar exactamente con...</label></div>
    <div class="reuseList" id="swapList"></div>
    <div class="footerrow">
      <button class="close" id="swapCancelBtn">Cancelar</button>
    </div>
  </div>
</div>

<div class="overlay" id="reuseOverlay">
  <div class="sheet">
    <h2>Biblioteca de sonidos</h2>
    <div class="reuseList" id="reuseList"></div>
    <div class="footerrow">
      <button class="close" id="reuseCancelBtn">Cancelar</button>
    </div>
  </div>
</div>

<div class="overlay" id="pinOverlay">
  <div class="sheet">
    <h2>Clave para editar</h2>
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="pinInput" id="pinInput" placeholder="••••">
    <div class="pinError" id="pinError"></div>
    <div class="footerrow">
      <button class="close" id="pinCancelBtn">Cancelar</button>
      <button class="save" id="pinConfirmBtn">Confirmar</button>
    </div>
  </div>
</div>

<div class="overlay" id="conflictOverlay">
  <div class="sheet">
    <h2>Ya existe un sonido con ese nombre</h2>
    <div class="conflictText" id="conflictText"></div>
    <div class="conflictBtns">
      <button class="replaceBtn" id="conflictReplaceBtn" type="button">Reemplazar (mueve el sonido a este botón)</button>
      <button class="cancelBtn2" id="conflictCancelBtn" type="button">Cancelar</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="audio/*">

<!-- Firebase (versión compatible, sin necesidad de npm/bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

<script>
  // ---- Configuración de tu proyecto de Firebase ----
  const firebaseConfig = {
    apiKey: "AIzaSyD--kgHwu9zjk76Jwgs5SFrq1Vd2gWoBbw",
    authDomain: "tablero-de-sonidos.firebaseapp.com",
    projectId: "tablero-de-sonidos",
    storageBucket: "tablero-de-sonidos.firebasestorage.app",
    messagingSenderId: "706381977339",
    appId: "1:706381977339:web:2ede4f1e8de2dbc94c025e"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();
  const padsCollection = db.collection('pads');

  const syncDot = document.getElementById('syncDot');
  const hintEl = document.getElementById('hint');

  let pads = []; // [{id, label, audioUrl, order}]
  let currentPadId = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let pendingAudioBlob = null;
  let pendingAudioLocalUrl = null;
  let pendingAudioUrl = null; // cuando se reutiliza un sonido ya existente
  let pendingAudioLabel = null;
  let pendingSourceFileName = null; // nombre original del archivo subido
  let replaceOldAudioUrl = null; // si el usuario eligió "reemplazar en todos", aquí va la URL vieja a sustituir
  let audioCtxUnlocked = false;
  const player = new Audio();
  let isPreviewPlaying = false;

  // ---- Escucha en tiempo real: cualquier cambio se refleja al instante ----
  let firstLoad = true;
  padsCollection.orderBy('order').onSnapshot(async (snapshot) => {
    syncDot.className = 'syncdot ok';
    if(snapshot.empty && firstLoad){
      firstLoad = false;
      await seedInitialPads();
      return; // el propio seed disparará este listener de nuevo
    }
    firstLoad = false;
    pads = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderGrid();
  }, (err) => {
    syncDot.className = 'syncdot err';
    hintEl.textContent = 'No se pudo conectar con la base de datos compartida (' + err.message + '). Revisa tu conexión a internet.';
  });

  async function seedInitialPads(){
    const batch = db.batch();
    for(let i=0;i<12;i++){
      const ref = padsCollection.doc();
      batch.set(ref, { label:'', audioUrl:null, order:i });
    }
    try{ await batch.commit(); }catch(e){ /* el listener mostrará el error si persiste */ }
  }

  const padStatus = {}; // padId -> 'checking' | 'ok' | 'error'
  let pendingCheckCount = 0;
  const checkedUrls = {}; // padId -> última audioUrl ya revisada
  let currentlyPlayingPadId = null;
  const EDIT_PIN = '9062';
  let sessionPin = null; // se guarda en memoria mientras esta pestaña esté abierta

  const pinOverlay = document.getElementById('pinOverlay');
  const pinInput = document.getElementById('pinInput');
  const pinError = document.getElementById('pinError');

  function requireEditAccess(){
    return new Promise((resolve) => {
      if(sessionPin === EDIT_PIN){ resolve(true); return; }
      pinInput.value = '';
      pinError.textContent = '';
      pinOverlay.classList.add('open');
      setTimeout(() => pinInput.focus(), 50);

      const cleanup = () => {
        pinOverlay.classList.remove('open');
        confirmBtn.removeEventListener('click', onConfirm);
        cancelBtn.removeEventListener('click', onCancel);
        pinInput.removeEventListener('input', onInput);
      };
      const confirmBtn = document.getElementById('pinConfirmBtn');
      const cancelBtn = document.getElementById('pinCancelBtn');
      const attemptConfirm = () => {
        if(pinInput.value === EDIT_PIN){
          sessionPin = EDIT_PIN;
          cleanup();
          resolve(true);
        } else if(pinInput.value.length >= 4){
          pinError.textContent = 'Clave incorrecta, intenta de nuevo.';
          pinInput.value = '';
          pinInput.focus();
        }
      };
      const onConfirm = () => attemptConfirm();
      const onCancel = () => { cleanup(); resolve(false); };
      const onInput = () => {
        pinInput.value = pinInput.value.replace(/[^0-9]/g, '').slice(0,4);
        if(pinInput.value.length === 4) attemptConfirm();
      };
      confirmBtn.addEventListener('click', onConfirm);
      cancelBtn.addEventListener('click', onCancel);
      pinInput.addEventListener('input', onInput);
    });
  }

  function padFacesHTML(pad){
    const frontContent = pad.audioUrl
      ? `${escapeHtml(pad.label || 'Sin nombre')}<div class="editIcon">✎</div>`
      : `<div class="plus">＋</div>${escapeHtml(pad.label || 'Vacío')}`;
    const backContent = `<div class="backLabel">${escapeHtml(pad.label || 'Sin nombre')}</div><div class="backStop">■</div>`;
    return `<div class="padInner">`
      + `<div class="padFace padFront">${frontContent}</div>`
      + `<div class="padFace padBack">${backContent}</div>`
      + `</div>`;
  }

  function renderGrid(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    pendingCheckCount = 0;
    pads.forEach((pad) => {
      const el = document.createElement('div');
      let statusClass = '';
      if(pad.audioUrl){
        const st = padStatus[pad.id];
        statusClass = st === 'ok' ? ' status-ok' : st === 'error' ? ' status-error' : ' status-checking';
      }
      el.className = 'pad' + statusClass + (pad.id === currentlyPlayingPadId ? ' flipped' : '');
      el.innerHTML = padFacesHTML(pad);

      let pressTimer = null;
      let longPressed = false;
      let touchMoved = false;
      let touchStartX = 0, touchStartY = 0;

      el.addEventListener('touchstart', (e) => {
        longPressed = false;
        touchMoved = false;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        pressTimer = setTimeout(() => { longPressed = true; openSheet(pad.id); }, 420);
      }, {passive:true});

      el.addEventListener('touchmove', (e) => {
        const t = e.touches[0];
        const dx = Math.abs(t.clientX - touchStartX);
        const dy = Math.abs(t.clientY - touchStartY);
        if(dx > 10 || dy > 10){
          touchMoved = true;
          clearTimeout(pressTimer); // si se está arrastrando (scroll), cancela el "mantener presionado"
        }
      }, {passive:true});

      el.addEventListener('touchend', () => {
        clearTimeout(pressTimer);
        if(longPressed || touchMoved) return; // fue un scroll, no un toque real
        if(pad.audioUrl){ togglePad(pad); } else { openSheet(pad.id); }
      });

      el.addEventListener('click', (ev) => {
        if(ev.target.classList.contains('editIcon')){
          ev.stopPropagation();
          openSheet(pad.id);
          return;
        }
        if('ontouchstart' in window) return;
        if(pad.audioUrl){ togglePad(pad); } else { openSheet(pad.id); }
      });

      grid.appendChild(el);

      if(pad.audioUrl && checkedUrls[pad.id] !== pad.audioUrl){
        checkedUrls[pad.id] = pad.audioUrl;
        const delay = pendingCheckCount * 250; // escalonado: uno cada 250ms
        pendingCheckCount++;
        setTimeout(() => checkPadAudio(pad), delay);
      }
    });
  }

  function setPadStatus(padId, status){
    padStatus[padId] = status;
    const idx = pads.findIndex(p => p.id === padId);
    if(idx === -1) return;
    const grid = document.getElementById('grid');
    const el = grid.children[idx];
    if(el){
      el.classList.remove('status-ok', 'status-error', 'status-checking');
      el.classList.add('status-' + status);
    }
  }

  function checkPadAudio(pad){
    padStatus[pad.id] = 'checking';
    const tester = new Audio();
    let settled = false;
    const finish = (ok) => {
      if(settled) return;
      settled = true;
      setPadStatus(pad.id, ok ? 'ok' : 'error');
      tester.src = '';
    };
    tester.addEventListener('canplaythrough', () => finish(true));
    tester.addEventListener('loadeddata', () => finish(true));
    tester.addEventListener('error', () => finish(false));
    setTimeout(() => finish(false), 8000); // si tarda demasiado, lo marcamos como problema
    tester.preload = 'auto';
    tester.src = pad.audioUrl;
    tester.load();
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function markPadPlaying(el, isPlaying){
    if(!el) return;
    el.classList.toggle('flipped', isPlaying);
  }

  function getPadElement(padId){
    const idx = pads.findIndex(p => p.id === padId);
    if(idx === -1) return null;
    return document.getElementById('grid').children[idx] || null;
  }

  const globalStopBtn = document.getElementById('globalStopBtn');

  function updateGlobalStopBtn(){
    globalStopBtn.style.display = currentlyPlayingPadId ? 'flex' : 'none';
  }

  function stopCurrentlyPlaying(){
    if(currentlyPlayingPadId){
      markPadPlaying(getPadElement(currentlyPlayingPadId), false);
    }
    try{ player.pause(); player.currentTime = 0; }catch(e){}
    currentlyPlayingPadId = null;
    updateGlobalStopBtn();
  }

  globalStopBtn.addEventListener('click', stopCurrentlyPlaying);

  function togglePad(pad){
    unlockAudio();
    if(currentlyPlayingPadId === pad.id){
      stopCurrentlyPlaying();
      return;
    }
    stopCurrentlyPlaying();
    player.src = pad.audioUrl;
    player.play().then(() => {
      currentlyPlayingPadId = pad.id;
      markPadPlaying(getPadElement(pad.id), true);
      updateGlobalStopBtn();
      setPadStatus(pad.id, 'ok');
      hintEl.textContent = 'Toca un botón vacío para asignarle un sonido. Mantén presionado un botón lleno para editarlo.';
      hintEl.style.color = '';
    }).catch((err) => {
      // Si el navegador bloqueó el audio (típico al volver de otra app o
      // de segundo plano en iOS), no es un problema del sonido en sí:
      // reactivamos la pantalla de "Probar sonido" para restablecer el permiso.
      if(err && (err.name === 'NotAllowedError' || err.name === 'NotSupportedError')){
        audioCtxUnlocked = false;
        startError.textContent = '';
        startBtn.disabled = false;
        startBtn.textContent = '▶\nProbar sonido';
        startOverlay.classList.remove('hidden');
        hintEl.textContent = 'El navegador pausó el audio (esto pasa al volver de otra app). Toca "Probar sonido" para reactivarlo.';
        hintEl.style.color = 'var(--danger)';
      } else {
        setPadStatus(pad.id, 'error');
        hintEl.textContent = 'No se pudo reproducir "' + (pad.label || 'este sonido') + '": ' + err.message;
        hintEl.style.color = 'var(--danger)';
      }
    });
    if(navigator.vibrate) navigator.vibrate(15);
  }

  player.addEventListener('ended', () => {
    if(currentlyPlayingPadId){
      markPadPlaying(getPadElement(currentlyPlayingPadId), false);
      currentlyPlayingPadId = null;
      updateGlobalStopBtn();
    }
  });

  function unlockAudio(){ audioCtxUnlocked = true; }

  // ---- Modal ----
  const overlay = document.getElementById('overlay');
  const labelInput = document.getElementById('labelInput');
  const statusEl = document.getElementById('status');
  const deleteBtn = document.getElementById('deleteBtn');
  const sheetTitle = document.getElementById('sheetTitle');
  const saveBtn = document.getElementById('saveBtn');

  let originalAudioUrlAtOpen = null;

  function openSheet(padId){
    currentPadId = padId;
    const pad = pads.find(p => p.id === padId);
    pendingAudioBlob = null;
    pendingAudioLocalUrl = null;
    pendingAudioUrl = null;
    pendingAudioLabel = null;
    pendingSourceFileName = null;
    replaceOldAudioUrl = null;
    originalAudioUrlAtOpen = (pad && pad.audioUrl) || null;
    resetPreviewButton();
    labelInput.value = (pad && pad.label) || '';
    updateStatus(pad && pad.audioUrl ? 'ya-tiene' : 'vacio');
    deleteBtn.style.display = (pad && pad.audioUrl) ? 'block' : 'none';
    document.getElementById('swapLinkRow').style.display = (pad && pad.audioUrl) ? 'block' : 'none';
    sheetTitle.textContent = (pad && pad.audioUrl) ? 'Editar botón' : 'Nuevo botón';
    saveBtn.disabled = false;
    overlay.classList.add('open');
  }

  function closeSheet(){
    overlay.classList.remove('open');
    stopRecordingIfActive();
    stopPreview();
    currentPadId = null;
    pendingAudioBlob = null;
    pendingAudioLocalUrl = null;
    pendingAudioUrl = null;
    pendingAudioLabel = null;
    pendingSourceFileName = null;
    replaceOldAudioUrl = null;
  }

  function updateStatus(state){
    if(pendingAudioBlob){
      statusEl.textContent = '✓ Sonido nuevo listo para subir';
      statusEl.style.color = 'var(--ok)';
    } else if(pendingAudioUrl){
      statusEl.textContent = '✓ Reutilizando: ' + (pendingAudioLabel || 'sonido existente');
      statusEl.style.color = 'var(--ok)';
    } else if(state === 'ya-tiene'){
      statusEl.textContent = '✓ Ya tiene un sonido guardado';
      statusEl.style.color = 'var(--ok)';
    } else {
      statusEl.textContent = 'Sin sonido asignado';
      statusEl.style.color = 'var(--text-dim)';
    }
  }

  document.getElementById('cancelBtn').addEventListener('click', closeSheet);

  saveBtn.addEventListener('click', async () => {
    if(currentPadId === null) return;
    const ok = await requireEditAccess();
    if(!ok) return;
    const newLabel = labelInput.value.trim();
    saveBtn.disabled = true;
    saveBtn.textContent = 'Guardando…';
    try{
      const updateData = { label: newLabel, editPin: EDIT_PIN };
      if(pendingAudioBlob){
        let ext = pendingAudioBlob.type.split('/')[1] || 'audio';
        if(ext.includes('mp4')) ext = 'm4a';
        if(ext === 'mpeg') ext = 'mp3';
        const path = 'sounds/' + currentPadId + '-' + Date.now() + '.' + ext;
        const ref = storage.ref().child(path);
        await ref.put(pendingAudioBlob, { customMetadata: { editPin: EDIT_PIN } });
        updateData.audioUrl = await ref.getDownloadURL();
        if(pendingSourceFileName) updateData.sourceFileName = pendingSourceFileName;
      } else if(pendingAudioUrl){
        updateData.audioUrl = pendingAudioUrl; // reutiliza el archivo ya existente, sin volver a subir
        updateData.sourceFileName = pendingSourceFileName || null;
      }
      await padsCollection.doc(currentPadId).set(updateData, { merge: true });

      // Si el usuario eligió "reemplazar en todos", actualizamos cada botón
      // Si el usuario eligió "reemplazar" porque ya existía ese sonido en
      // otro botón: el sonido se MUEVE aquí, así que vaciamos ese otro
      // botón (nunca debe haber dos botones con el mismo sonido a la vez),
      // y borramos el archivo viejo de Storage.
      if(replaceOldAudioUrl && updateData.audioUrl){
        const oldUrl = replaceOldAudioUrl;
        const affected = pads.filter(p => p.id !== currentPadId && p.audioUrl === oldUrl);
        if(affected.length){
          const batch = db.batch();
          affected.forEach(p => {
            batch.set(padsCollection.doc(p.id), {
              label: '',
              audioUrl: null,
              sourceFileName: null,
              editPin: EDIT_PIN
            }, { merge: true });
          });
          await batch.commit();
        }
        try{
          await storage.refFromURL(oldUrl).delete();
        }catch(delErr){ /* si falla el borrado, no es crítico, solo queda un archivo huérfano */ }
      }

      // Limpieza general: si este mismo botón tenía OTRO sonido antes y ahora
      // quedó apuntando a uno distinto, borramos el anterior — siempre y
      // cuando ningún otro botón lo siga usando (por ejemplo, vía Biblioteca).
      if(
        updateData.audioUrl &&
        originalAudioUrlAtOpen &&
        originalAudioUrlAtOpen !== updateData.audioUrl
      ){
        const stillUsedElsewhere = pads.some(p => p.id !== currentPadId && p.audioUrl === originalAudioUrlAtOpen);
        if(!stillUsedElsewhere){
          try{
            await storage.refFromURL(originalAudioUrlAtOpen).delete();
          }catch(delErr){ /* no crítico */ }
        }
      }

      closeSheet();
    }catch(err){
      statusEl.textContent = 'Error al guardar: ' + err.message;
      statusEl.style.color = 'var(--danger)';
    }finally{
      saveBtn.disabled = false;
      saveBtn.textContent = 'Guardar';
    }
  });

  deleteBtn.addEventListener('click', async () => {
    if(currentPadId === null) return;
    const ok = await requireEditAccess();
    if(!ok) return;
    try{
      const urlToClean = originalAudioUrlAtOpen;
      await padsCollection.doc(currentPadId).set({ label:'', audioUrl:null, sourceFileName: null, editPin: EDIT_PIN }, { merge:true });
      if(urlToClean){
        const stillUsedElsewhere = pads.some(p => p.id !== currentPadId && p.audioUrl === urlToClean);
        if(!stillUsedElsewhere){
          try{ await storage.refFromURL(urlToClean).delete(); }catch(delErr){ /* no crítico */ }
        }
      }
      closeSheet();
    }catch(err){
      statusEl.textContent = 'Error al eliminar: ' + err.message;
      statusEl.style.color = 'var(--danger)';
    }
  });

  document.getElementById('addPadBtn').addEventListener('click', async () => {
    const ok = await requireEditAccess();
    if(!ok) return;
    const maxOrder = pads.reduce((m,p) => Math.max(m, p.order || 0), -1);
    try{
      await padsCollection.add({ label:'', audioUrl:null, order: maxOrder + 1, editPin: EDIT_PIN });
    }catch(err){
      hintEl.textContent = 'No se pudo agregar el botón: ' + err.message;
    }
  });

  const previewBtn = document.getElementById('previewBtn');

  function resetPreviewButton(){
    isPreviewPlaying = false;
    previewBtn.textContent = '▶ Escuchar';
  }

  function stopPreview(){
    try{ player.pause(); player.currentTime = 0; }catch(e){}
    resetPreviewButton();
  }

  previewBtn.addEventListener('click', () => {
    unlockAudio();
    if(isPreviewPlaying){
      stopPreview();
      return;
    }
    let url = null;
    if(pendingAudioLocalUrl){ url = pendingAudioLocalUrl; }
    else if(pendingAudioUrl){ url = pendingAudioUrl; }
    else {
      const pad = pads.find(p => p.id === currentPadId);
      if(pad && pad.audioUrl) url = pad.audioUrl;
    }
    if(!url) return;
    player.src = url;
    player.play().then(() => {
      isPreviewPlaying = true;
      previewBtn.textContent = '■ Detener';
    }).catch(()=>{});
  });

  player.addEventListener('ended', () => { resetPreviewButton(); });

  // ---- Reutilizar sonido existente ----
  const reuseOverlay = document.getElementById('reuseOverlay');
  const reuseList = document.getElementById('reuseList');
  const reuseBtn = document.getElementById('reuseBtn');

  reuseBtn.addEventListener('click', () => {
    const options = pads.filter(p => p.audioUrl && p.id !== currentPadId);
    reuseList.innerHTML = '';
    if(options.length === 0){
      reuseList.innerHTML = '<div class="reuseEmpty">Todavía no hay otros sonidos guardados para reutilizar.</div>';
    } else {
      options.forEach(p => {
        const item = document.createElement('div');
        item.className = 'reuseItem';
        item.innerHTML = `
          <div class="rname">${escapeHtml(p.label || 'Sin nombre')}</div>
          <button class="rplay" type="button">▶</button>
          <button class="rpick" type="button">Mover aquí</button>
        `;
        item.querySelector('.rplay').addEventListener('click', () => {
          unlockAudio();
          try{ player.pause(); }catch(e){}
          player.src = p.audioUrl;
          player.play().catch(()=>{});
        });
        item.querySelector('.rpick').addEventListener('click', async () => {
          reuseOverlay.classList.remove('open');
          await swapWithPad(p.id);
        });
        reuseList.appendChild(item);
      });
    }
    reuseOverlay.classList.add('open');
  });

  document.getElementById('reuseCancelBtn').addEventListener('click', () => {
    try{ player.pause(); }catch(e){}
    reuseOverlay.classList.remove('open');
  });

  // ---- Intercambiar posición con otro botón ----
  const swapOverlay = document.getElementById('swapOverlay');
  const swapList = document.getElementById('swapList');
  const swapLinkBtn = document.getElementById('swapLinkBtn');

  swapLinkBtn.addEventListener('click', () => {
    const others = pads.filter(p => p.id !== currentPadId);
    swapList.innerHTML = '';
    if(others.length === 0){
      swapList.innerHTML = '<div class="reuseEmpty">No hay otros botones para intercambiar.</div>';
    } else {
      others.forEach(p => {
        const item = document.createElement('div');
        item.className = 'reuseItem';
        const desc = p.audioUrl ? escapeHtml(p.label || 'Sin nombre') : 'Vacío';
        item.innerHTML = `
          <div class="rname">${desc}</div>
          <button class="rpick" type="button">Intercambiar</button>
        `;
        item.querySelector('.rpick').addEventListener('click', async () => {
          swapOverlay.classList.remove('open');
          await swapWithPad(p.id);
        });
        swapList.appendChild(item);
      });
    }
    swapOverlay.classList.add('open');
  });

  document.getElementById('swapCancelBtn').addEventListener('click', () => {
    swapOverlay.classList.remove('open');
  });

  async function reorderCurrentPad(toStart){
    const ok = await requireEditAccess();
    if(!ok) return;
    const current = pads.find(p => p.id === currentPadId);
    if(!current) return;
    const rest = pads.filter(p => p.id !== currentPadId).sort((a,b) => (a.order||0) - (b.order||0));
    const newOrder = toStart ? [current, ...rest] : [...rest, current];
    saveBtn.disabled = true;
    statusEl.textContent = 'Moviendo…';
    statusEl.style.color = 'var(--text-dim)';
    try{
      const batch = db.batch();
      newOrder.forEach((p, idx) => {
        batch.set(padsCollection.doc(p.id), { order: idx, editPin: EDIT_PIN }, { merge: true });
      });
      await batch.commit();
      swapOverlay.classList.remove('open');
      closeSheet();
    }catch(err){
      statusEl.textContent = 'Error al mover: ' + err.message;
      statusEl.style.color = 'var(--danger)';
    }finally{
      saveBtn.disabled = false;
    }
  }

  document.getElementById('moveStartBtn').addEventListener('click', () => reorderCurrentPad(true));
  document.getElementById('moveEndBtn').addEventListener('click', () => reorderCurrentPad(false));

  async function swapWithPad(otherPadId){
    const ok = await requireEditAccess();
    if(!ok) return;
    const a = pads.find(p => p.id === currentPadId);
    const b = pads.find(p => p.id === otherPadId);
    if(!a || !b) return;
    saveBtn.disabled = true;
    statusEl.textContent = 'Intercambiando…';
    statusEl.style.color = 'var(--text-dim)';
    try{
      const batch = db.batch();
      batch.set(padsCollection.doc(a.id), {
        label: b.label || '',
        audioUrl: b.audioUrl || null,
        sourceFileName: b.sourceFileName || null,
        editPin: EDIT_PIN
      }, { merge: true });
      batch.set(padsCollection.doc(b.id), {
        label: a.label || '',
        audioUrl: a.audioUrl || null,
        sourceFileName: a.sourceFileName || null,
        editPin: EDIT_PIN
      }, { merge: true });
      await batch.commit();
      closeSheet();
    }catch(err){
      statusEl.textContent = 'Error al intercambiar: ' + err.message;
      statusEl.style.color = 'var(--danger)';
    }finally{
      saveBtn.disabled = false;
    }
  }

  // ---- Subir archivo ----
  const fileInput = document.getElementById('fileInput');
  document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());

  const conflictOverlay = document.getElementById('conflictOverlay');
  const conflictText = document.getElementById('conflictText');

  function applyChosenFile(file, matchedPad){
    pendingAudioBlob = file;
    pendingAudioLocalUrl = URL.createObjectURL(file);
    pendingSourceFileName = file.name;
    let name = file.name.replace(/\.[^/.]+$/, ''); // quita la extensión
    name = name.replace(/[_-]+/g, ' ').trim();
    labelInput.value = name.slice(0, 24);
    updateStatus();
  }

  function askFileConflict(file, matchedPad){
    return new Promise((resolve) => {
      conflictText.innerHTML = 'Ya existe un sonido llamado <b>' + escapeHtml(file.name) + '</b> en el botón <b>' + escapeHtml(matchedPad.label || 'otro botón') + '</b>. Un mismo sonido no puede estar en dos botones a la vez.';
      conflictOverlay.classList.add('open');
      const replaceBtn = document.getElementById('conflictReplaceBtn');
      const cancelBtn2 = document.getElementById('conflictCancelBtn');
      const cleanup = () => {
        conflictOverlay.classList.remove('open');
        replaceBtn.removeEventListener('click', onReplace);
        cancelBtn2.removeEventListener('click', onCancel);
      };
      const onReplace = () => { cleanup(); resolve('replace'); };
      const onCancel = () => { cleanup(); resolve('cancel'); };
      replaceBtn.addEventListener('click', onReplace);
      cancelBtn2.addEventListener('click', onCancel);
    });
  }

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    fileInput.value = ''; // permite volver a elegir el mismo archivo después si hace falta

    const matchedPad = pads.find(p =>
      p.id !== currentPadId &&
      p.audioUrl &&
      p.sourceFileName &&
      p.sourceFileName.trim().toLowerCase() === file.name.trim().toLowerCase()
    );

    if(matchedPad){
      const choice = await askFileConflict(file, matchedPad);
      if(choice === 'cancel') return;
      replaceOldAudioUrl = matchedPad.audioUrl;
      applyChosenFile(file, matchedPad);
    } else {
      replaceOldAudioUrl = null;
      applyChosenFile(file, null);
    }
  });

  // ---- Grabar ----
  const recordBtn = document.getElementById('recordBtn');
  let isRecording = false;

  recordBtn.addEventListener('click', async () => {
    if(isRecording){ stopRecordingIfActive(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if(e.data.size>0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, {type: 'audio/mp4'});
        pendingAudioBlob = blob;
        pendingAudioLocalUrl = URL.createObjectURL(blob);
        updateStatus();
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      recordBtn.classList.add('recording');
      recordBtn.querySelector('.ic').textContent = '■';
      statusEl.textContent = 'Grabando… toca de nuevo para detener';
      statusEl.style.color = 'var(--danger)';
    }catch(err){
      statusEl.textContent = 'No se pudo acceder al micrófono (' + err.message + ')';
      statusEl.style.color = 'var(--danger)';
    }
  });

  function stopRecordingIfActive(){
    if(mediaRecorder && isRecording){
      mediaRecorder.stop();
      isRecording = false;
      recordBtn.classList.remove('recording');
      recordBtn.querySelector('.ic').textContent = '●';
    }
  }

  // ---- Desbloqueo de audio con botón "Probar sonido" ----
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');
  const startError = document.getElementById('startError');

  // Beep corto real (mismo tipo de reproducción que usan los botones del
  // tablero: un <audio> con un archivo, no un tono generado). Así se

  startBtn.addEventListener('click', () => {
    startBtn.disabled = true;
    startBtn.textContent = 'Reproduciendo…';
    startError.textContent = '';

    player.src = BEEP_DATA_URL;
    player.play().then(() => {
      audioCtxUnlocked = true;

      let proceeded = false;
      const showReadyAndAdvance = () => {
        if(proceeded) return;
        proceeded = true;
        startBtn.classList.add('success');
        startBtn.textContent = '✓\n¡Listo!';
        setTimeout(() => {
          startOverlay.classList.add('hidden');
        }, 500); // le da tiempo a que se escuche el sonido de prueba antes de mostrar el tablero
      };

      // Esperamos a que el audio esté REALMENTE sonando (no solo que el
      // navegador haya dado permiso), para que no se sienta desfasado.
      player.addEventListener('playing', showReadyAndAdvance, { once: true });
      // Respaldo por si el evento 'playing' no dispara en algún navegador.
      setTimeout(showReadyAndAdvance, 500);
    }).catch((err) => {
      startBtn.disabled = false;
      startBtn.textContent = '▶\nProbar sonido';
      startError.textContent = 'No se pudo reproducir sonido (' + (err && err.message ? err.message : 'error desconocido') + '). Revisa el volumen y toca de nuevo.';
    });
  });

  // Recién aquí, al final, sabemos que todo el código (incluidas las
  // librerías de Firebase cargadas por internet) ya terminó de cargar y
  // conectarse — por eso activamos el botón hasta este punto exacto, para
  // que un clic muy rápido justo al abrir la página nunca caiga en el vacío.
  startBtn.disabled = false;
  startBtn.innerHTML = '▶<br>Probar sonido';
</script>
